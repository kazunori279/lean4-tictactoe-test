[project]
name = "lean4-tictactoe-test"
version = "0.1.0"
description = "Sample setup for differential testing a Python Tic-Tac-Toe app against a Lean 4 executable specification"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
